[package]
name = "janus-client"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "The Janus client shared by every app: engine, contacts, storage, timers and cover traffic."

[dependencies]
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
janus-core = { version = "0.1.0", path = "../janus-core" }
janus-transport = { version = "0.1.0", path = "../janus-transport" }
sha2 = "0.11.1"
zeroize = "1.9.1"

[dev-dependencies]
janus-transport = { version = "0.1.0", path = "../janus-transport", features = ["sim"] }

[lints]
workspace = true
