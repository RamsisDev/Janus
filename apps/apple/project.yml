# XcodeGen spec of the iOS app; `make apple` builds the Rust library and runs `xcodegen`.
name: Janus
options:
  bundleIdPrefix: org.janusknot
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Janus:
    type: application
    platform: iOS
    # A shared scheme, which `xcodebuild -scheme Janus` needs.
    scheme:
      testTargets: [JanusUITests]
    sources:
      - path: Janus
      - path: Generated/janus_ffi.swift
      - path: Generated/mailbox.der
        optional: true
        buildPhase: resources
    dependencies:
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.janusknot.janus
        TARGETED_DEVICE_FAMILY: "1"
        # The Rust library per SDK, not an XCFramework: `create-xcframework` took both of our
        # libraries for the device one.
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/Generated/ios
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/Generated/ios-sim
        OTHER_LDFLAGS: [-ljanus_ffi]
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Generated/include
        # Read only by Debug builds, with `Generated/mailbox.der`; the simulator reaches the
        # host's localhost.
        JANUS_DEV_MAILBOX: "127.0.0.1:7000"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Janus
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Scans the QR code of a network you install.
        NSFaceIDUsageDescription: Unlocks Janus.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [org.janusknot.janus.refresh]
        JanusDevMailbox: $(JANUS_DEV_MAILBOX)
  JanusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JanusUITests]
    dependencies:
      - target: Janus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.janusknot.janus.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Janus
