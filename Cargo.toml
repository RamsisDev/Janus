[workspace]
members = [
    "crates/janus-core",
    "crates/janus-cli",
    "crates/janus-client",
    "crates/janus-desktop",
    "crates/janus-ffi",
    "crates/janus-mailbox",
    "crates/janus-transport",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
